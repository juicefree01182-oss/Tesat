<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق بنكي تجريبي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- تسجيل الدخول / التسجيل -->
        <div id="auth">
            <h2>تسجيل / دخول</h2>
            <input id="email" type="email" placeholder="البريد الإلكتروني">
            <input id="password" type="password" placeholder="كلمة المرور">
            <button id="loginBtn" class="auth-btn">دخول</button>
            <button id="registerBtn" class="auth-btn secondary">إنشاء حساب</button>
        </div>

        <!-- لوحة البنك -->
        <div id="bank" class="hidden">
            <h2>🏦 محفظتي</h2>

            <div class="card">
                <div class="balance" id="balance">0 SDG</div>
                <p id="account">رقم الحساب: -</p>
            </div>

            <div class="card">
                <h3>الإيداع والسحب</h3>
                <input id="amount" type="number" placeholder="المبلغ">
                <div class="btn-group">
                    <button id="depositBtn" class="action-btn">إيداع</button>
                    <button id="withdrawBtn" class="action-btn secondary">سحب</button>
                </div>
            </div>

            <div class="card">
                <h3>تحويل الأموال</h3>
                <input id="toUid" placeholder="UID المستلم">
                <input id="transferAmount" type="number" placeholder="مبلغ التحويل">
                <button id="transferBtn" class="action-btn">تحويل</button>
            </div>

            <button id="logoutBtn" class="logout-btn">تسجيل الخروج</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- ملفات JavaScript -->
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
